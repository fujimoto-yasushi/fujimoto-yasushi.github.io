<script>const observer=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}})},{threshold:.06});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));const dlg=document.getElementById('viewer'),large=document.getElementById('large');document.querySelectorAll('.photo').forEach(btn=>btn.addEventListener('click',()=>{large.src=btn.dataset.full;large.alt=btn.querySelector('img').alt;dlg.showModal()}));document.getElementById('close').addEventListener('click',()=>dlg.close());dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});</script></body></html>
